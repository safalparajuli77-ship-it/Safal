<style>
:root{--paper:#eeeae2;--ink:#111;--lime:#d7ff00;--orange:#ff4d16;--amber:#F47B20;--mono:ui-monospace,Menlo,Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;overflow:hidden;color:var(--ink);font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at 85% 12%,rgba(255,77,22,.14),transparent 46%),radial-gradient(circle at 10% 90%,rgba(142,112,255,.14),transparent 46%),#f4edde}
body::before{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(17,17,17,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(17,17,17,.05) 1px,transparent 1px);background-size:48px 48px}
.stage{position:relative;width:min(420px,86vw);height:min(300px,36vh)}
.ball{position:absolute;left:50%;top:0;width:78px;height:78px;margin-left:-39px;animation:drop 1.1s infinite}
.ball svg{display:block;width:100%;height:100%;animation:spin 1.6s linear infinite}
.floor{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--ink)}
.shadow{position:absolute;left:50%;bottom:-14px;width:70px;height:10px;margin-left:-35px;border-radius:50%;background:rgba(17,17,17,.22);animation:shade 1.1s infinite}
@keyframes drop{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.55,0,1,.45)}50%{transform:translateY(calc(min(300px,36vh) - 78px));animation-timing-function:cubic-bezier(0,.55,.45,1)}100%{transform:translateY(0)}}
@keyframes shade{0%,100%{transform:scale(.5);opacity:.4}50%{transform:scale(1.1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:clamp(90px,22vw,220px);line-height:.8;letter-spacing:-.08em;font-weight:900}
p{font:700 12px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;max-width:34ch}
a{display:inline-block;margin-top:6px;padding:14px 20px;background:var(--lime);color:var(--ink);border:1px solid var(--ink);box-shadow:6px 6px 0 var(--ink);font:700 11px var(--mono);letter-spacing:.12em;text-decoration:none;transition:transform .3s}
a:hover,a:focus-visible{transform:translate(-3px,-3px)}
@media(prefers-reduced-motion:reduce){.ball,.ball svg,.shadow{animation:none}}
</style>
</head>
