<style>

/* =========================================================
   PHOTO WALL
========================================================= */

.photo-wall {

  width: 100%;

  display: flex;
  flex-direction: row;

  /* VERY IMPORTANT */
  flex-wrap: nowrap;

  justify-content: center;
  align-items: flex-start;

  gap: 24px;

  padding: 80px 30px 120px;

  box-sizing: border-box;

  overflow-x: auto;
  overflow-y: visible;

  scrollbar-width: none;
}

.photo-wall::-webkit-scrollbar {
  display: none;
}


/* =========================================================
   CLIPBOARD / PAPER CARD
========================================================= */

.clipboard-card {

  position: relative;

  /* FOUR CARDS FIT IN ONE ROW */
  flex: 0 0 calc((100vw - 170px) / 4);

  width: calc((100vw - 170px) / 4);

  height: 31vw;

  max-width: 300px;
  max-height: 420px;

  min-width: 180px;
  min-height: 270px;

  box-sizing: border-box;

  padding: 12px 12px 40px;

  background: #f3f0e7;

  box-shadow:
    0 18px 35px rgba(0, 0, 0, 0.22),
    0 4px 8px rgba(0, 0, 0, 0.12);

  flex-shrink: 0;

  transition:
    transform 0.45s cubic-bezier(.2,.8,.2,1),
    box-shadow 0.45s ease;

  transform-origin: 50% 10%;
}


/* =========================================================
   INDIVIDUAL ROTATIONS
========================================================= */

.photo-card-1 {
  transform: rotate(-3deg);
}

.photo-card-2 {
  transform: rotate(2deg);
}

.photo-card-3 {
  transform: rotate(-2deg);
}

.photo-card-4 {
  transform: rotate(3deg);
}


/* =========================================================
   HOVER EFFECT
========================================================= */

.clipboard-card:hover {

  z-index: 20;

  transform:
    translateY(-18px)
    rotate(0deg)
    scale(1.05);

  box-shadow:
    0 35px 60px rgba(0, 0, 0, 0.35),
    0 8px 15px rgba(0, 0, 0, 0.15);
}


/* =========================================================
   PHOTO AREA
========================================================= */

.photo-frame {

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #ddd;

  border: 1px solid rgba(0, 0, 0, 0.12);

  box-sizing: border-box;
}


.photo-frame img {

  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;

  object-position: center;

  transition:
    transform 0.7s cubic-bezier(.2,.8,.2,1);
}


/* PHOTO ZOOM */

.clipboard-card:hover .photo-frame img {

  transform: scale(1.08);

}


/* =========================================================
   PHOTO LABEL
========================================================= */

.photo-label {

  position: absolute;

  left: 14px;
  bottom: 13px;

  font-family: Arial, Helvetica, sans-serif;

  font-size: 9px;

  letter-spacing: 0.16em;

  color: #111;

  text-transform: uppercase;
}


/* =========================================================
   METAL CLIP
========================================================= */

.paper-clip {

  position: absolute;

  z-index: 50;

  width: 44px;
  height: 30px;

  top: -17px;
  left: 50%;

  transform: translateX(-50%);

  border-radius: 6px 6px 9px 9px;

  background:
    linear-gradient(
      90deg,
      #666 0%,
      #ddd 15%,
      #999 30%,
      #fff 48%,
      #888 66%,
      #ddd 84%,
      #666 100%
    );

  box-shadow:
    0 5px 8px rgba(0, 0, 0, 0.4),
    inset 0 1px 2px rgba(255,255,255,.8),
    inset 0 -2px 3px rgba(0,0,0,.25);
}


/* =========================================================
   CLIP VERTICAL NECK
========================================================= */

.paper-clip::before {

  content: "";

  position: absolute;

  width: 3px;
  height: 20px;

  left: 50%;
  top: -19px;

  transform: translateX(-50%);

  background: #777;

  box-shadow:
    1px 0 2px rgba(255,255,255,.5);
}


/* =========================================================
   CLIP HIGHLIGHT
========================================================= */

.paper-clip::after {

  content: "";

  position: absolute;

  left: 7px;
  right: 7px;

  top: 4px;

  height: 4px;

  border-radius: 50%;

  background: rgba(255,255,255,.55);
}


/* =========================================================
   DESKTOP — FORCE FOUR IN ONE LINE
========================================================= */

@media (min-width: 1101px) {

  .photo-wall {

    overflow-x: visible;

    justify-content: center;

  }

  .clipboard-card {

    flex: 0 0 calc((100vw - 170px) / 4);

    width: calc((100vw - 170px) / 4);

  }

}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 1100px) {

  .photo-wall {

    justify-content: flex-start;

    overflow-x: auto;

    padding-left: 50px;
    padding-right: 50px;

  }

  .clipboard-card {

    flex: 0 0 240px;

    width: 240px;

    height: 340px;

  }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  .photo-wall {

    gap: 20px;

    padding:
      60px 35px
      100px;

    justify-content: flex-start;

  }

  .clipboard-card {

    flex: 0 0 230px;

    width: 230px;

    height: 320px;

  }

}

</style>
